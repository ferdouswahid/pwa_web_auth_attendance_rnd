server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively (hashed filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must never be cached
    location = /attendance/ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /attendance/ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular SPA fallback — all routes serve index.html
    location /attendance/ {
        try_files $uri $uri/ /attendance/index.html;
    }
}
